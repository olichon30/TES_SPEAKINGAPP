<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3단계: 한→영 말하기 - TES Speaking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <style>
        .practice-layout {
            display: flex;
            flex-direction: column;
            gap: var(--sp-4);
        }

        .record-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--sp-3);
        }

        .record-hint {
            font-size: var(--text-sm);
            color: var(--text-gray);
            text-align: center;
            min-height: 20px;
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--radius-full);
            background: var(--bg-gray);
            color: var(--text-gray);
            font-size: var(--text-sm);
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .retry-btn:active { background: #dde8e9; }

        /* Korean-only card — bigger text, no English */
        .kr-sentence-card {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: var(--sp-8) var(--sp-6);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .kr-sentence-text {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .kr-sentence-hint {
            font-size: var(--text-sm);
            color: var(--text-gray);
            margin-top: var(--sp-3);
        }

        .swipe-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
            font-size: var(--text-xs);
            color: var(--text-light);
            padding: var(--sp-1) 0;
        }
    </style>
</head>

<body>
    <div class="app-container" style="padding-bottom: 88px;">
        <!-- Header -->
        <header class="app-header">
            <a href="learn-step2.html" class="back-btn"><i class="ti ti-arrow-left"></i></a>
            <h1 class="header-title">한→영 말하기</h1>
            <div class="header-action"></div>
        </header>

        <!-- Step Progress -->
        <div class="step-progress">
            <div class="step-dots">
                <div class="step-dot done"></div>
                <div class="step-dot done"></div>
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>
            <div class="step-label"><span>3단계</span> · 한→영 말하기</div>
        </div>

        <div class="page-content">
            <div class="practice-layout">

                <!-- Korean Sentence Card (Swipeable) -->
                <div id="swipeArea">
                    <div class="kr-sentence-card swipe-card" id="sentenceCard">
                        <div class="kr-sentence-text" id="sentenceKr">—</div>
                        <div class="kr-sentence-hint">
                            <i class="ti ti-microphone"></i> 위 문장을 영어로 말해보세요
                        </div>
                    </div>

                    <div class="sentence-counter" id="sentenceCounter"></div>

                    <div class="swipe-hint">
                        <i class="ti ti-arrows-left-right"></i>
                        좌우로 밀어서 문장 이동
                    </div>
                </div>

                <!-- Comparison Result -->
                <div class="comparison-result hidden" id="comparisonResult"></div>

                <!-- Record Section -->
                <div class="record-section">
                    <button class="record-btn-large" id="recordBtn" onclick="toggleRecording()">
                        <i class="ti ti-microphone"></i>
                    </button>

                    <p class="record-hint" id="recordHint">버튼을 눌러 영어로 말하세요</p>

                    <button class="retry-btn hidden" id="retryBtn" onclick="toggleRecording()">
                        <i class="ti ti-refresh"></i> 다시하기
                    </button>
                </div>

                <!-- Accuracy -->
                <div class="accuracy-display hidden" id="accuracyDisplay">
                    <div class="accuracy-circle" style="--accuracy: 0;">
                        <span class="accuracy-value" id="accuracyValue">0%</span>
                    </div>
                    <div class="accuracy-label">정확도</div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="prevSentence()">
                <i class="ti ti-arrow-left"></i> 이전
            </button>
            <button class="btn btn-primary" onclick="nextSentence()" id="nextBtn">
                다음 <i class="ti ti-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/speech.js"></script>
    <script>
        let sentences = [];
        let currentIndex = 0;
        let isRecording = false;
        let touchStartX = 0, touchStartY = 0;

        const swipeArea = document.getElementById('swipeArea');

        swipeArea.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        swipeArea.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                if (dx < 0) nextSentence();
                else prevSentence();
            }
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', () => {
            sentences = JSON.parse(sessionStorage.getItem('currentSentences')) || [];
            if (sentences.length === 0) { window.location.href = 'learn-step1.html'; return; }
            buildPips();
            updateSentence('in');
        });

        function buildPips() {
            const counter = document.getElementById('sentenceCounter');
            counter.innerHTML = sentences.map((_, i) =>
                `<div class="sentence-pip" id="pip-${i}"></div>`
            ).join('');
        }

        function updatePips() {
            sentences.forEach((_, i) => {
                const pip = document.getElementById(`pip-${i}`);
                pip.className = 'sentence-pip' + (i < currentIndex ? ' done' : i === currentIndex ? ' active' : '');
            });
        }

        function updateSentence(dir) {
            const card = document.getElementById('sentenceCard');
            document.getElementById('sentenceKr').textContent = sentences[currentIndex].kr;

            if (dir && dir !== 'in') {
                card.classList.remove('slide-in-left', 'slide-in-right');
                void card.offsetWidth;
                card.classList.add(dir === 'left' ? 'slide-in-left' : 'slide-in-right');
            }

            updatePips();
            resetRecordUI();

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.innerHTML = currentIndex === sentences.length - 1
                ? '다음 단계 <i class="ti ti-arrow-right"></i>'
                : '다음 <i class="ti ti-arrow-right"></i>';
        }

        function resetRecordUI() {
            document.getElementById('accuracyDisplay').classList.add('hidden');
            document.getElementById('comparisonResult').classList.add('hidden');
            document.getElementById('recordHint').textContent = '버튼을 눌러 영어로 말하세요';
            document.getElementById('recordHint').classList.remove('hidden');
            document.getElementById('recordBtn').classList.remove('hidden');
            document.getElementById('retryBtn').classList.add('hidden');
        }

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const retryBtn = document.getElementById('retryBtn');
            const hint = document.getElementById('recordHint');

            if (!isRecording) {
                isRecording = true;
                btn.classList.remove('hidden');
                retryBtn.classList.add('hidden');
                hint.classList.remove('hidden');
                btn.classList.add('recording');
                btn.innerHTML = '<i class="ti ti-player-stop"></i>';
                hint.textContent = '말하고 있어요... 버튼을 눌러 중지';
                document.getElementById('accuracyDisplay').classList.add('hidden');
                document.getElementById('comparisonResult').classList.add('hidden');

                if (typeof startSpeechRecognition === 'function') {
                    startSpeechRecognition(sentences[currentIndex].en, result => {
                        stopRecordingUI();
                        if (result.error) showError(result.errorMessage || '음성 인식 오류');
                        else showAccuracy(result.accuracy, result.transcript);
                    });
                } else {
                    stopRecordingUI();
                    showError('음성인식 모듈을 불러올 수 없습니다.');
                }
            } else {
                if (typeof stopSpeechRecognition === 'function') stopSpeechRecognition();
                stopRecordingUI();
            }
        }

        function stopRecordingUI() {
            const btn = document.getElementById('recordBtn');
            const retryBtn = document.getElementById('retryBtn');
            const hint = document.getElementById('recordHint');
            isRecording = false;
            btn.classList.remove('recording');
            btn.innerHTML = '<i class="ti ti-microphone"></i>';
            btn.classList.add('hidden');
            retryBtn.classList.remove('hidden');
            hint.classList.add('hidden');
        }

        function showAccuracy(accuracy, transcript) {
            const display = document.getElementById('accuracyDisplay');
            document.getElementById('accuracyValue').textContent = accuracy + '%';
            display.querySelector('.accuracy-circle').style.setProperty('--accuracy', accuracy);
            display.classList.remove('hidden');

            const progress = JSON.parse(sessionStorage.getItem('learningProgress') || '{"accuracyScores":[]}');
            progress.accuracyScores = progress.accuracyScores || [];
            progress.accuracyScores.push(accuracy);
            sessionStorage.setItem('learningProgress', JSON.stringify(progress));

            if (transcript) {
                document.getElementById('comparisonResult').innerHTML = compareWords(sentences[currentIndex].en, transcript);
                document.getElementById('comparisonResult').classList.remove('hidden');
            }
        }

        function compareWords(target, spoken) {
            const tWords = target.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/);
            const sWords = spoken.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/);
            const tOrig = target.replace(/[^\w\s]/g, '').split(/\s+/);
            const sOrig = spoken.replace(/[^\w\s]/g, '').split(/\s+/);

            let html = '<div style="margin-bottom:6px"><strong style="color:var(--text-gray);font-size:var(--text-xs)">정답</strong><br>';
            tOrig.forEach((w, i) => {
                html += sWords.includes(tWords[i])
                    ? `<span style="color:var(--success);font-weight:600">${w}</span> `
                    : `<span style="color:var(--error);font-weight:600;text-decoration:underline">${w}</span> `;
            });
            html += '</div><div><strong style="color:var(--text-gray);font-size:var(--text-xs)">내 발음</strong><br>';
            sOrig.forEach((w, i) => {
                html += tWords.includes(sWords[i])
                    ? `<span style="color:var(--success)">${w}</span> `
                    : `<span style="color:var(--warning);text-decoration:line-through">${w}</span> `;
            });
            return html + '</div>';
        }

        function showError(msg) {
            document.getElementById('accuracyDisplay').classList.add('hidden');
            const hint = document.getElementById('recordHint');
            hint.innerHTML = `<span style="color:var(--error)">${msg}</span>`;
            hint.classList.remove('hidden');
        }

        function prevSentence() {
            if (currentIndex > 0) { currentIndex--; updateSentence('right'); }
        }

        function nextSentence() {
            if (currentIndex < sentences.length - 1) { currentIndex++; updateSentence('left'); }
            else window.location.href = 'learn-step4.html';
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../service-worker.js').then(() => {}).catch(() => {});
            });
        }
    </script>
</body>

</html>
